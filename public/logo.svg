<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Luxury Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Rounded Shield / Base -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#crestGrad)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Architectural Modern Villa Roofline -->
    <path d="M50 20 L22 46 L30 46 L30 76 L70 76 L70 46 L78 46 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Golden Core Keystone -->
    <path d="M50 36 L36 50 L64 50 Z" fill="url(#goldGrad)"/>
    
    <!-- Modern Doorway / Pillars -->
    <rect x="44" y="58" width="12" height="18" rx="2" fill="url(#goldGrad)"/>
    <line x1="36" y1="58" x2="36" y2="76" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="58" x2="64" y2="76" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Foundation Baseline -->
    <line x1="20" y1="82" x2="80" y2="82" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(126, 32)">
    <!-- Brand Title -->
    <text x="0" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.03em" fill="#0f172a">
      Gurdaspur<tspan fill="#059669">Property</tspan>
    </text>

    <!-- .in Luxury Badge -->
    <g transform="translate(325, 6)">
      <rect x="0" y="0" width="38" height="24" rx="6" fill="#059669"/>
      <text x="19" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">.IN</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="1" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11.5" letter-spacing="0.18em" fill="#64748b" text-transform="uppercase">
      Premier Real Estate &amp; Advisory • Batala Road
    </text>
  </g>
</svg>
